apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      containers:
      - name: activity-service
        image: kafka-microservice-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/activity-logs"
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: activity-service-config
              key: KAFKA_BROKER
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: activity-service-config
              key: PORT
        - name: KAFKAJS_NO_PARTITIONER_WARNING
          valueFrom:
            configMapKeyRef:
              name: activity-service-config
              key: KAFKAJS_NO_PARTITIONER_WARNING
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: activity-service
spec:
  type: LoadBalancer
  selector:
    app: activity-service
  ports:
  - port: 80
    targetPort: 3000